name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade e testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Bibliotecas do sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Tipos (mypy)
        run: |
          uv run mypy
          uv run mypy --platform win32

      - name: Contratos de arquitetura (import-linter)
        run: uv run lint-imports

      - name: Testes
        run: uv run pytest --cov --cov-report=term --cov-report=xml -o junit_family=xunit2 --junitxml=pytest-${{ matrix.os }}.xml

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-${{ matrix.os }}
          path: |
            pytest-${{ matrix.os }}.xml
            coverage.xml

  empacotar:
    name: Empacotar executáveis (Windows)
    needs: qualidade
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Gerar pacote
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Teste de fumaça com os executáveis prontos
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist -Directory -Filter 'WinKit-*' | Select-Object -First 1
          $cli = Join-Path $pkg.FullName 'winkit\winkit.exe'
          $agent = Join-Path $pkg.FullName 'winkit-agent'
          $root = Join-Path $env:RUNNER_TEMP 'pendrive'
          New-Item -ItemType Directory -Force $root | Out-Null
          & $cli --version
          & $cli receita nova --raiz $root --usuario Samuel --nome-pc PC-CI
          if ($LASTEXITCODE -ne 0) { throw "receita nova falhou" }
          & $cli construir --raiz $root --agente $agent
          if ($LASTEXITCODE -ne 0) { throw "construir falhou" }
          & $cli validar --raiz $root
          if ($LASTEXITCODE -ne 0) { throw "validar falhou" }
          if (-not (Test-Path (Join-Path $root 'WinKit\Agent\winkit-agent\winkit-agent.exe'))) { throw "Agente não copiado" }
          if (-not (Test-Path (Join-Path $root 'WinKit\Agent\bootstrap.ps1'))) { throw "bootstrap ausente" }
          $p = Start-Process -FilePath (Join-Path $agent 'winkit-agent.exe') -ArgumentList 'summary' -Wait -PassThru
          if ($p.ExitCode -ne 1) { throw "Agente não iniciou corretamente (código $($p.ExitCode))" }
          $studio = Join-Path $pkg.FullName 'winkit-studio\winkit-studio.exe'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $s = Start-Process -FilePath $studio -ArgumentList '--teste-fumaca' -Wait -PassThru
          if ($s.ExitCode -ne 0) { throw "Studio não abriu (código $($s.ExitCode))" }
          Write-Host "Fumaça OK"

      - name: Publicar pacote
        uses: actions/upload-artifact@v4
        with:
          name: WinKit-windows
          path: dist/WinKit-*
