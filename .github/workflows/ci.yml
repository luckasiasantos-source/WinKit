name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade e testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Bibliotecas do sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Tipos (mypy)
        run: uv run mypy

      - name: Contratos de arquitetura (import-linter)
        run: uv run lint-imports

      - name: Testes
        run: uv run pytest --cov --cov-report=term --cov-report=xml -o junit_family=xunit2 --junitxml=pytest-${{ matrix.os }}.xml

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-${{ matrix.os }}
          path: |
            pytest-${{ matrix.os }}.xml
            coverage.xml
