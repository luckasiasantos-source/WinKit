name: Release

# Publica uma versão pronta para baixar: ao enviar uma tag vX.Y.Z (que precisa bater com
# winkit.__version__) ou à mão, em Actions → Release → Run workflow (a tag v<versão> é
# criada no commit escolhido).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    name: Compilar e publicar (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Conferir a versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv sync --locked
          $version = (uv run python -c "import winkit; print(winkit.__version__)").Trim()
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $tag -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME não bate com a versão $version" }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "A release $tag já existe; suba __version__ antes" }
          # "não encontrada" (código 1) é o esperado; o Actions sairia com esse código (IN-012)
          $global:LASTEXITCODE = 0
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Testes
        shell: pwsh
        timeout-minutes: 25
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest -q
          if ($LASTEXITCODE -ne 0) { throw "testes falharam" }

      - name: Gerar pacote
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Teste de fumaça com os executáveis prontos
        shell: pwsh
        run: pwsh -NoProfile -File packaging\smoke.ps1

      - name: Compactar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $zip = "release\WinKit-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "dist\WinKit-$env:VERSION" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  WinKit-$env:VERSION-windows-x64.zip" | Out-File "$zip.sha256" -Encoding ascii

      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG --target $env:GITHUB_SHA `
            "release\WinKit-$env:VERSION-windows-x64.zip" `
            "release\WinKit-$env:VERSION-windows-x64.zip.sha256" `
            --title "WinKit $env:VERSION (pré-alpha)" `
            --notes-file packaging\NOTAS_DA_VERSAO.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "falha ao criar a release" }
