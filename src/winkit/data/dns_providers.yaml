# Servidores DNS públicos que o WinKit sabe configurar (V2-16, M14).
# Endereços e modelos DoH conforme a documentação de cada serviço (campo "source").
- id: cloudflare
  name: Cloudflare (1.1.1.1)
  ipv4: [1.1.1.1, 1.0.0.1]
  ipv6: ["2606:4700:4700::1111", "2606:4700:4700::1001"]
  doh_template: https://cloudflare-dns.com/dns-query
  source: https://developers.cloudflare.com/1.1.1.1/ip-addresses/
- id: cloudflare_family
  name: Cloudflare para Famílias
  ipv4: [1.1.1.3, 1.0.0.3]
  ipv6: ["2606:4700:4700::1113", "2606:4700:4700::1003"]
  doh_template: https://family.cloudflare-dns.com/dns-query
  family: true
  source: https://developers.cloudflare.com/1.1.1.1/setup/#1111-for-families
- id: quad9
  name: Quad9
  ipv4: [9.9.9.9, 149.112.112.112]
  ipv6: ["2620:fe::fe", "2620:fe::9"]
  doh_template: https://dns.quad9.net/dns-query
  source: https://www.quad9.net/service/service-addresses-and-features
- id: google
  name: Google Public DNS
  ipv4: [8.8.8.8, 8.8.4.4]
  ipv6: ["2001:4860:4860::8888", "2001:4860:4860::8844"]
  doh_template: https://dns.google/dns-query
  source: https://developers.google.com/speed/public-dns/docs/using
- id: adguard
  name: AdGuard DNS
  ipv4: [94.140.14.14, 94.140.15.15]
  ipv6: ["2a10:50c0::ad1:ff", "2a10:50c0::ad2:ff"]
  doh_template: https://dns.adguard-dns.com/dns-query
  source: https://adguard-dns.io/kb/general/dns-providers/
- id: nextdns
  name: NextDNS
  ipv4: [45.90.28.0, 45.90.30.0]
  ipv6: []
  doh_template: https://dns.nextdns.io/{id}
  needs_id: true
  source: https://help.nextdns.io/t/g9hmv0a/setup-windows
