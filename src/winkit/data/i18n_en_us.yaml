# Traduções dos catálogos (inglês) — D-030, R-51.
# Chave = id do item no catálogo base (pt-BR). `text` do bloatware = side_effect ou reason.
tweaks:
  maintenance.storage_sense:
    title: Storage Sense
    description: Windows deletes temporary files and empties the old Recycle Bin by itself when the disk fills up.
  privacy.telemetry_minimum:
    title: Minimum allowed telemetry
    description: Sends Microsoft only the required diagnostic data.
  privacy.advertising_id:
    title: Turn off the advertising ID
    description: Apps stop using an identifier for personalized ads.
  privacy.activity_history:
    title: Turn off activity history
    description: Windows does not record or send your activity history.
  privacy.tailored_experiences:
    title: Turn off tailored experiences
    description: Microsoft does not use your diagnostic data for tips and ads.
  privacy.start_bing_search:
    title: Start search without web results (Bing)
    description: Start menu search looks only on the computer.
  privacy.start_suggestions:
    title: No app suggestions in Start and Settings
    description: Removes "suggestions" (ads) from the Start menu and the Settings app.
  privacy.copilot:
    title: Turn off Copilot
    description: Hides the button and turns off Windows Copilot (the app can be removed in the bloatware list).
  privacy.recall:
    title: Turn off Recall
    description: Turns off the feature that takes periodic screenshots (only on Copilot+ PCs).
  privacy.widgets:
    title: Turn off Widgets (news and interests)
    description: Turns off the Widgets board and the news on the taskbar.
  privacy.welcome_experience:
    title: No "welcome" and "let's finish setting up" screens
    description: Windows stops showing service offer screens after updates.
  privacy.lock_screen_tips:
    title: No tips and fun facts on the lock screen
    description: The lock screen shows only the picture and the clock.
  visual.dark_theme:
    title: Dark theme
    description: Windows and apps in dark mode.
  visual.taskbar_left:
    title: Taskbar aligned to the left
    description: Start button and icons on the left, like Windows 10.
  visual.show_extensions:
    title: Show file extensions
    description: Shows ".exe", ".pdf" etc. in File Explorer.
  visual.show_hidden_files:
    title: Show hidden files
    description: Shows hidden files and folders (such as AppData) in File Explorer.
  visual.classic_context_menu:
    title: Classic context menu (full right-click)
    description: Right-click shows the full Windows 10 menu again, without "Show more options".
  visual.explorer_this_pc:
    title: File Explorer opens on "This PC"
    description: File Explorer opens showing the drives instead of the home page.
  visual.hide_task_view_button:
    title: Hide the Task View button
    description: Removes the virtual desktops button from the taskbar (the Win+Tab shortcut still works).
  visual.hide_widgets_button:
    title: Hide the Widgets button
    description: Removes the Widgets/weather button from the taskbar.
  visual.hide_chat_button:
    title: Hide the Teams/Chat button
    description: Removes the chat button from the taskbar.
  visual.search_icon_only:
    title: Taskbar search as an icon only
    description: Replaces the large search box with a magnifier icon.
  visual.start_hide_recommended:
    title: Start without recommendations and recent files
    description: Hides tips and recent files in the "Recommended" section of Start.
  system.prevent_device_encryption:
    title: Do not encrypt the disk automatically
    description: Prevents automatic device encryption, even after signing in with a Microsoft account (D-020). Manual
      BitLocker is still available.
  system.wu_no_driver_replacement:
    title: Windows Update does not replace drivers
    description: Windows Update stops installing drivers over the ones you installed.
  system.consumer_content:
    title: Block suggested apps installed by themselves
    description: Keeps Windows from installing "suggested" games and apps (Candy Crush, TikTok etc.).
  system.long_paths:
    title: Allow long paths
    description: Compatible programs can use paths longer than 260 characters.
