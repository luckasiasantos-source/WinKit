# Traduções dos catálogos (espanhol) — D-030, R-51.
# Chave = id do item no catálogo base (pt-BR). `text` do bloatware = side_effect ou reason.
tweaks:
  privacy.telemetry_minimum:
    title: Telemetría al mínimo permitido
    description: Envía a Microsoft solo los datos de diagnóstico obligatorios.
  privacy.advertising_id:
    title: Desactivar el identificador de publicidad
    description: Las aplicaciones dejan de usar un identificador para anuncios personalizados.
  privacy.activity_history:
    title: Desactivar el historial de actividad
    description: Windows no registra ni envía el historial de actividad.
  privacy.tailored_experiences:
    title: Desactivar las experiencias personalizadas
    description: Microsoft no usa tus datos de diagnóstico para sugerencias y anuncios.
  privacy.start_bing_search:
    title: Búsqueda de Inicio sin resultados web (Bing)
    description: La búsqueda del menú Inicio busca solo en el equipo.
  privacy.start_suggestions:
    title: Sin sugerencias de aplicaciones en Inicio y Configuración
    description: Quita las "sugerencias" (publicidad) del menú Inicio y de la aplicación Configuración.
  privacy.copilot:
    title: Desactivar Copilot
    description: Oculta el botón y desactiva Copilot de Windows (la aplicación se puede quitar en la lista de bloatware).
  privacy.recall:
    title: Desactivar Recall
    description: Desactiva la función que toma capturas de pantalla periódicas (solo en equipos Copilot+).
  privacy.widgets:
    title: Desactivar Widgets (noticias e intereses)
    description: Desactiva el panel de Widgets y las noticias en la barra de tareas.
  privacy.welcome_experience:
    title: Sin pantallas de "bienvenida" y "terminemos de configurar"
    description: Windows deja de mostrar pantallas de ofertas de servicios después de las actualizaciones.
  privacy.lock_screen_tips:
    title: Sin consejos ni curiosidades en la pantalla de bloqueo
    description: La pantalla de bloqueo muestra solo la imagen y el reloj.
  visual.dark_theme:
    title: Tema oscuro
    description: Ventanas y aplicaciones en modo oscuro.
  visual.taskbar_left:
    title: Barra de tareas alineada a la izquierda
    description: Botón Inicio e iconos a la izquierda, como en Windows 10.
  visual.show_extensions:
    title: Mostrar extensiones de archivo
    description: Muestra ".exe", ".pdf", etc. en el Explorador de archivos.
  visual.show_hidden_files:
    title: Mostrar archivos ocultos
    description: Muestra archivos y carpetas ocultos (como AppData) en el Explorador.
  visual.classic_context_menu:
    title: Menú contextual clásico (clic derecho completo)
    description: El clic derecho vuelve a mostrar el menú completo de Windows 10, sin "Mostrar más opciones".
  visual.explorer_this_pc:
    title: El Explorador se abre en "Este equipo"
    description: El Explorador de archivos se abre mostrando las unidades en lugar de la página de inicio.
  visual.hide_task_view_button:
    title: Ocultar el botón Vista de tareas
    description: Quita el botón de escritorios virtuales de la barra de tareas (el atajo Win+Tab sigue funcionando).
  visual.hide_widgets_button:
    title: Ocultar el botón de Widgets
    description: Quita el botón de Widgets/clima de la barra de tareas.
  visual.hide_chat_button:
    title: Ocultar el botón de Teams/Chat
    description: Quita el botón de chat de la barra de tareas.
  visual.search_icon_only:
    title: Búsqueda de la barra de tareas solo como icono
    description: Cambia el cuadro de búsqueda grande por un icono de lupa.
  visual.start_hide_recommended:
    title: Inicio sin recomendaciones ni archivos recientes
    description: Oculta consejos y archivos recientes en la sección "Recomendado" de Inicio.
  system.prevent_device_encryption:
    title: No cifrar el disco automáticamente
    description: Impide el cifrado automático del dispositivo, incluso después de iniciar sesión con una cuenta
      Microsoft (D-020). BitLocker manual sigue disponible.
  system.wu_no_driver_replacement:
    title: Windows Update no reemplaza los controladores
    description: Windows Update deja de instalar controladores encima de los que instalaste.
  system.consumer_content:
    title: Bloquear aplicaciones sugeridas que se instalan solas
    description: Impide que Windows instale juegos y aplicaciones "sugeridos" (Candy Crush, TikTok, etc.).
  system.long_paths:
    title: Permitir rutas largas
    description: Los programas compatibles pueden usar rutas de más de 260 caracteres.
